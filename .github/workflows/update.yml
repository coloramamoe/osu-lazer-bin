name: Update package
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-osu-lazer-bin
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.sh
      - name: Build XBPS package
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true'
        run: |
          set -eu
          packages="$RUNNER_TEMP/void-packages"
          git clone --depth 1 https://github.com/void-linux/void-packages.git "$packages"
          mkdir -p "$packages/srcpkgs/osu-lazer-bin"
          cp template "$packages/srcpkgs/osu-lazer-bin/template"
          cp -a files "$packages/srcpkgs/osu-lazer-bin/files"
          docker run --rm --pull=always \
            -v "$packages:/hostrepo" \
            -w /hostrepo \
            ghcr.io/void-linux/void-glibc-full:latest \
            /bin/sh -ec '
              xbps-install -Syu xbps
              xbps-install -y base-chroot base-devel bash git
              printf "XBPS_ALLOW_RESTRICTED=yes\\nXBPS_CHROOT_CMD=ethereal\\nXBPS_ALLOW_CHROOT_BREAKOUT=yes\\n" >> etc/conf
              ln -s / masterdir
              ./xbps-src pkg osu-lazer-bin
            '
      - name: Upload XBPS package
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: osu-lazer-bin-${{ steps.upstream.outputs.version }}-x86_64
          path: |
            ${{ runner.temp }}/void-packages/hostdir/binpkgs/nonfree/osu-lazer-bin-*.xbps
            ${{ runner.temp }}/void-packages/hostdir/binpkgs/nonfree/x86_64-repodata
          if-no-files-found: error
          retention-days: 90
      - name: Commit updated package
        run: |
          if git diff --quiet -- template; then
            exit 0
          fi
          version="$(sed -n 's/^version=//p' template)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add template
          git commit -m "update"
          git push
