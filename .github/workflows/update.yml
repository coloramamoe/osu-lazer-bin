name: Update package
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-osu-lazer-bin
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.sh
      - name: Check package release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(sed -n 's/^version=//p' template)_$(sed -n 's/^revision=//p' template)"
          if gh release view "$tag" --json isDraft,assets --jq '.isDraft == false and (.assets | length >= 2)' | grep -qx true; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build XBPS package
        if: steps.upstream.outputs.changed == 'true' || steps.release.outputs.missing == 'true'
        run: |
          set -eu
          packages="$RUNNER_TEMP/void-packages"
          git clone --depth 1 https://github.com/void-linux/void-packages.git "$packages"
          mkdir -p "$packages/srcpkgs/osu-lazer-bin"
          cp template "$packages/srcpkgs/osu-lazer-bin/template"
          cp -a files "$packages/srcpkgs/osu-lazer-bin/files"
          docker run --rm --pull=always \
            -v "$packages:/hostrepo" \
            -w /hostrepo \
            ghcr.io/void-linux/void-glibc-full:latest \
            /bin/sh -ec '
              xbps-install -Syu xbps
              xbps-install -y base-devel bsdtar bash git
              printf "XBPS_ALLOW_RESTRICTED=yes\\nXBPS_CHROOT_CMD=ethereal\\nXBPS_ALLOW_CHROOT_BREAKOUT=yes\\n" >> etc/conf
              ln -s / masterdir
              xbps-uhelper arch > /.xbps_chroot_init
              ./xbps-src pkg osu-lazer-bin
            '
      - name: Commit updated package
        run: |
          if git diff --quiet -- template; then
            exit 0
          fi
          version="$(sed -n 's/^version=//p' template)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add template
          git commit -m "update"
          git push
      - name: Publish release
        if: steps.upstream.outputs.changed == 'true' || steps.release.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(sed -n 's/^version=//p' template)_$(sed -n 's/^revision=//p' template)"
          packages=("$RUNNER_TEMP"/void-packages/hostdir/binpkgs/nonfree/osu-lazer-bin-*.xbps)
          repodata="$RUNNER_TEMP/void-packages/hostdir/binpkgs/nonfree/x86_64-repodata"
          test -f "${packages[0]}"
          test -f "$repodata"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${packages[0]}" "$repodata" --clobber
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" "${packages[0]}" "$repodata" --title "$tag" --notes "" --target "$(git rev-parse HEAD)" --latest
          fi
